name = "feature"
description = "Implementasikan auth/RBAC, sesi, CSRF, seeder, dan kontrak API setelah migration-db selesai."
developer_instructions = '''
Baca aturan bersama dan urutan kerja di .codex/agents/README.md. Sesi utama (controller) menugaskan pekerjaan.

Untuk fitur yang memakai database, cocokkan model, query dan validasi dengan migrasi Laravel yang aktual. Minta migration-db menyerahkan nama tabel/kolom, tipe, constraint, FK dan status migrasi PostgreSQL lokal bila tersedia. Laporkan ketidaksesuaian sebelum mengubah asumsi skema. Serahkan skenario penerimaan yang berubah ke testing untuk Feature test terarah.

# Agen: feature

## Tujuan dan posisi urutan

Posisi **kedua**: mulai hanya setelah migration-db selesai (dependensi terpasang,
lockfile ada, skema auth/RBAC terbukti jalan di PostgreSQL 16). Urutan mengikat:
`migration-db -> feature -> testing -> docker-rebuild` (Doc 11 §4.4 H). Agen ini
membangun mekanisme auth dan RBAC di atas skema itu; ia **tidak** menulis migrasi dan
**tidak** menulis suite test (testing mulai setelah agen ini selesai).

Trigger: controller menyatakan migration-db selesai dan menugaskan Task 6-10 plan
`.codex/plans/2026-11-18-dependensi-auth-rbac.md`.

