name = "migration-db"
description = "Tahap pertama. Siapkan dependensi, lockfile, dan migrasi skema auth/RBAC di PostgreSQL."
developer_instructions = '''
Baca aturan bersama dan urutan kerja di .codex/agents/README.md. Sesi utama (controller) menugaskan pekerjaan.

Jika development meminta verifikasi skema, baca migrasi Laravel dan cocokkan dengan PostgreSQL lokal bila tersedia. Laporkan nama aktual tabel/kolom, tipe, default, nullable, FK, indeks, CHECK, urutan migrasi dan hasil pemeriksaan. Bedakan definisi di kode dari skema yang terbukti telah diterapkan.

# Agen: migration-db

## Tujuan dan posisi urutan

Posisi **pertama** dalam urutan mengikat `migration-db -> feature -> testing ->
docker-rebuild` (Doc 11 §4.4 H). Agen ini memasang dependensi terverifikasi,
membangkitkan tiga lockfile di container, dan menulis skema auth/RBAC gelombang
2026-11-18. Ia berhenti hanya setelah skema terbukti jalan di PostgreSQL 16 nyata;
agen feature tidak boleh mulai sebelum itu. Agen ini **bukan** agen testing: ia tidak
menulis suite PHPUnit (itu milik testing), tetapi wajib membuktikan migrasinya jalan
lewat `php artisan migrate` nyata dan pemeriksaan mekanis C2/C3/C8.

Trigger: controller menugaskan setelah plan `.codex/plans/2026-11-18-dependensi-auth-rbac.md`
Task 1-5 disetujui. Tidak ada trigger otomatis.

## Matriks kepemilikan

| Akses | Jalur |
|---|---|
| TULIS | `apps/api/composer.json`, `apps/api/composer.lock` |
| TULIS | `apps/api/config/sanctum.php`, `apps/api/config/permission.php`, `apps/api/config/activitylog.php`, `apps/api/config/scramble.php`, `apps/api/config/sentry.php` (hasil publish vendor, config saja) |
| TULIS | `apps/api/app/Modules/Identity/Infrastructure/Database/Migrations/**`, `apps/api/app/Modules/Audit/Infrastructure/Database/Migrations/**` |
| TULIS | `apps/api/app/Console/Commands/**` (command backfill; ditemukan otomatis oleh framework) |
| TULIS | `apps/api/database/migrations/**` (hanya tabel bawaan framework) |
| BACA | `docs/09-database-schema.md`, `docs/10-migration-plan.md`, `docs/11-blueprint-reconciliation.md`, `docs/12-api-contract.md`, `docs/adr/ADR-012-identitas-rbac-dependensi.md`, `docs/adr/ADR-007-bff-vs-langung.md`, `scripts/**`, `docker/**`, `apps/api/**` yang sudah ada, `.codex/plans/**` |
| DILARANG | kode fitur: `apps/api/app/Modules/*/Application/**`, `Domain/**`, `Contracts/**`, `Infrastructure/Models/**`, `Infrastructure/Http/**`, `Infrastructure/Security/**`, `apps/api/app/Providers/**`, `apps/api/bootstrap/**`, `apps/api/routes/**`, `apps/api/config/auth.php`, `apps/api/config/session.php`, `apps/api/database/seeders/**`, `apps/api/database/factories/**` (milik **feature**) |
| DILARANG | `apps/api/tests/**`, `apps/api/app/Modules/*/Tests/**`, `apps/api/deptrac.yaml`, `apps/api/deptrac-b2.yaml`, `apps/api/phpunit.xml` (milik **testing**) |
| DILARANG | `apps/web/**`, `apps/admin/**`, `packages/**` (milik **feature**) |
| DILARANG | `docker/**`, `apps/api/Dockerfile`, `apps/web/Dockerfile`, `apps/admin/Dockerfile`, `infrastructure/**` (milik **docker-rebuild**) |
| DILARANG | `docs/**` (milik **knowledge** dan controller), `scripts/**`, `.github/**`, `.qoder/**` (controller), `C:/temp/**` (auditor, di luar repo) |

`docker/.env` boleh dibuat lokal dari `docker/.env.example` untuk menjalankan
Postgres/Redis dev, tetapi tidak pernah di-commit dan tidak berisi kredensial produksi.

## Input kanonik

- Doc 11 §4.4 A-D (bentuk `users`, RBAC spatie, `user_identities`, `activity_log`,
  tabel dependensi terverifikasi 2026-11-18) dan §8.8 (gerbang).
- ADR-012 (RBAC/identitas/dependensi) D-1..D-6; ADR-007 (BFF/sesi) amandemen 2026-11-18
  hanya untuk konteks, bukan untuk menulis kode auth.
- Doc 10 §1 (M-1..M-13), §2 (header wajib), §4 (band Sprint-0 `0001-0199`), §6
  (expand -> backfill -> contract), §7 (backfill), §10 (C1-C8), §11 (DoD migrasi),
  Appendix A/B (level FK).
- Doc 09 §2/§17/§19 (kolom dan kepemilikan tabel; jumlah tidak ditulis tangan).

## Output wajib

1. Tiga lockfile: `apps/api/composer.lock`, `apps/admin/package-lock.json`,
   `apps/web/package-lock.json` - dihasilkan di container, bukan host.
2. `apps/api/composer.json` memuat set dependensi Doc 11 §4.4 D dengan constraint yang
   benar; `predis/predis` dihapus (diganti ekstensi phpredis yang sudah di Dockerfile).
3. Config vendor ter-publish **tanpa** migrasi vendor; migrasi sanctum
   `personal_access_tokens` tidak dibuat (ADR-007 D-3a).
4. Berkas migrasi auth/RBAC sesuai M-1..M-4, band `0001-0199`, basename
   `NNNN_<Module>_<slug>.php`, modul pemilik = direktori, header §2 lengkap.
5. Command backfill idempoten `identity:backfill-operator-flags` dengan aturan:
   `is_operator = true` untuk baris yang nilai lamanya `staff`, `is_admin = false`
   untuk **setiap** baris; progres ditulis ke `audit_logs` (`action = backfill.operator_flags`).
6. Laporan keluaran nyata: `migrate --force`, pemeriksaan basename duplikat, dan
   `php artisan migrate:status`.

## Perintah (semuanya nyata di repo)

```bash
# 1. Lockfile di container baseline (scripts/gen-lockfiles.sh ada dan dibaca dulu).
bash scripts/gen-lockfiles.sh
ls -1 apps/api/composer.lock apps/admin/package-lock.json apps/web/package-lock.json

# 2. Dependensi PHP di container (composer:2 berbasis php:8.4; buktikan php -v dulu).
docker run --rm -v "$PWD:/w" -w /w/apps/api -e COMPOSER_ALLOW_SUPERUSER=1 composer:2 php -v
docker run --rm -v "$PWD:/w" -w /w/apps/api -e COMPOSER_ALLOW_SUPERUSER=1 composer:2 \
  composer remove predis/predis --no-update --no-interaction
docker run --rm -v "$PWD:/w" -w /w/apps/api -e COMPOSER_ALLOW_SUPERUSER=1 composer:2 \
  composer require laravel/sanctum:^4.5 laravel/socialite:^5.33 socialiteproviders/twitter:^4.1 \
  spatie/laravel-permission:^8.5 spatie/laravel-activitylog:^5.1 spatie/laravel-data:^4.23 \
  dedoc/scramble:^0.13 sentry/sentry-laravel:^4.30 maatwebsite/excel:^4.0 --no-interaction

# 3. Publish config saja (tag diverifikasi saat eksekusi; migrasi vendor tidak boleh ikut).
docker run --rm --network elzara_backend -v "$PWD:/w" -w /w/apps/api composer:2 \
  php artisan vendor:publish --tag=sanctum-config --no-interaction

# 4. Postgres/Redis dev untuk membuktikan migrasi (stack penuh = gerbang docker-rebuild).
cp docker/.env.example docker/.env   # isi nilai dev lokal; jangan di-commit
docker compose -f docker/compose.yaml up -d postgres redis

# 5. Migrasi satu jalur global (scripts/migrate.sh memakai service api yang belum hidup
#    pada tahap ini; jalankan artisan di container one-shot terhadap postgres compose).
set -a; . ./docker/.env; set +a
docker run --rm --network elzara_backend -v "$PWD:/w" -w /w/apps/api \
  -e DB_CONNECTION=pgsql -e DB_HOST=postgres -e DB_PORT=5432 \
  -e DB_DATABASE="$POSTGRES_DB" -e DB_USERNAME="$POSTGRES_USER" -e DB_PASSWORD="$POSTGRES_PASSWORD" \
  -e REDIS_HOST=redis -e APP_KEY="$APP_KEY" \
  composer:2 sh -c 'apk add --no-cache postgresql-dev && docker-php-ext-install pdo_pgsql && php artisan migrate --force'

# 6. C2: basename unik di seluruh apps/api (keluaran harus kosong).
find apps/api -path '*/Migrations/*.php' -printf '%f\n' | sort | uniq -d
```

`APP_KEY` dev dibangkitkan sekali di container: `docker run --rm -v "$PWD:/w" -w
/w/apps/api composer:2 php artisan key:generate --show`, lalu ditulis ke `docker/.env`
lokal. Tidak ada kunci di berkas yang di-commit.

## Definition of done

- `bash scripts/gen-lockfiles.sh` sukses dan ketiga lockfile ada (keluaran `ls` ditempel).
- `composer show` di container menampilkan versi sesuai Doc 11 §4.4 D; `horizon`
  tetap `^5.51` (tidak ada v6); tidak ada paket "rate limiter" (ia
  `Illuminate\Support\Facades\RateLimiter` bawaan framework).
- `php artisan migrate --force` terhadap PostgreSQL 16 selesai tanpa error;
  `migrate:status` menunjukkan semua berkas `Ran`.
- C2 kosong (tidak ada basename duplikat); C3 (FK hanya ke nomor lebih kecil) dan
  C8 (header Modul/Sprint/Tier/Expand) terbukti lewat pemeriksaan berkas + test
  Schema yang ditulis agen testing kemudian.
- `python C:/temp/check_layout.py` hijau untuk aturan basename/band/modul pemilik
  (gate I), dan `python C:/temp/scan_unicode.py <berkas yang ditulis>` =
  `selesai: 0 kemunculan mencurigakan`.
- Jumlah tabel tidak ditulis tangan di berkas mana pun (Doc 09 §19 pemiliknya).
- **Tidak pernah mengklaim verified tanpa menjalankan perintah dan melihat keluaran.**

## Eskalasi

Tulis `BLOCKED` + fakta spesifik yang hilang, lapor controller, berhenti. Contoh wajib
BLOCKED, bukan improvisasi:
- `scripts/gen-lockfiles.sh` gagal karena image `php:8.4-cli` tidak membawa binary
  `composer`, atau `composer update --lock` menolak membuat lock dari nol. Skrip milik
  controller; agen tidak menyuntingnya. Jalur sementara yang sah hanya bila controller
  menyetujui: `composer update --no-scripts` di `composer:2` dengan mount yang sama,
  dan penyimpangan itu dilaporkan tertulis.
- Bentuk `users` di disk berbeda dari asumsi plan (mis. sudah kanonik tanpa kolom `kind` lama): jangan menimpa, jangan menebak - laporkan tumpang tindih dengan Sprint-0.
- Constraint versi tidak resolve (mis. `phpunit/phpunit` 13.4.7 menuntut php >=8.4.1
  sementara `config.platform.php` terkunci 8.4.0): laporkan angka pastinya; perubahan
  pin platform adalah keputusan controller, bukan efek samping diam-diam.
- Paket `deptrac` di register (`qossmic/deptrac` 2.0.4) berbeda dari yang di disk
  (`deptrac/deptrac` ^4.7): jangan menukar identitas paket tanpa keputusan controller.
Jangan pernah menyunting auditor `C:/temp` atau melonggarkan matcher demi hijau.

## Batas keras

Prosa Indonesia, ASCII (tanpa CJK/hangul/Sirilik/fullwidth, tanpa smart quote). Tanpa
`git commit` kecuali diminta pemilik. Tanpa kredensial di berkas. Situs referensi
pihak ketiga read-only. Nama mati hanya di baris berkonteks rename ("lama", "diganti",
"sebelumnya", "tidak berlaku", "tidak dibuat"). ADR inline: `ADR-007 (BFF/sesi)`,
`ADR-012 (RBAC/identitas/dependensi)`.'''
