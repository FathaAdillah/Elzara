x-local-runtime: &local-runtime
  restart: "on-failure:3"

services:
  api:
    <<: *local-runtime
    environment:
      SESSION_SECURE_COOKIE: "false"
      ELZARA_LOCAL_ADMIN_PASSWORD_ONLY_EMAIL: ${ELZARA_LOCAL_ADMIN_PASSWORD_ONLY_EMAIL:-}
  web: { <<: *local-runtime }
  admin: { <<: *local-runtime }
  postgres:
    <<: *local-runtime
    environment:
      # Tidak ada tujuan off-node di laptop; produksi/staging wajib `required` (default compose.yaml).
      ELZARA_BACKUP_MODE: "off"

  redis: { <<: *local-runtime }
  elasticsearch: { <<: *local-runtime }
  minio:
    <<: *local-runtime
    image: elzara/minio:dev

  migration:
    image: elzara/api:${GIT_SHA:-dev}
    restart: "no"
    command: ["php", "artisan", "migrate", "--force"]
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY:?APP_KEY wajib diisi}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:?POSTGRES_DB wajib diisi}
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER wajib diisi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
    depends_on:
      api: { condition: service_healthy }
    networks: [backend]

  worker:
    <<: *local-runtime
    deploy:
      replicas: 2
    depends_on:
      migration: { condition: service_completed_successfully }

  scheduler:
    <<: *local-runtime
    depends_on:
      migration: { condition: service_completed_successfully }

  mailpit:
    <<: *local-runtime
    image: axllent/mailpit:v1.27
    networks: [frontend, backend]
    ports:
      - "127.0.0.1:${ELZARA_LOCAL_MAIL_PORT:-8025}:8025"
  nginx:
    <<: *local-runtime
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/metrics.conf:/etc/nginx/conf.d/metrics.conf:ro
    ports:
      - "127.0.0.1:${ELZARA_LOCAL_HTTP_PORT:-80}:80"
