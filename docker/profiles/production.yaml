# Override production: service yang sama, nilai yang lebih tinggi. Yang berbeda dari staging adalah isi
# env-nya (WORKER_MEMORY_LIMIT, ELZARA_EDGE_URL, domain, bucket, kredensial gateway - Doc 01 §11.3),
# bukan struktur stacknya. Satu node tetap single point of failure (Doc 01 §11.5) - tidak ada klaim HA di sini.

x-env-file: &x-env-file
  env_file: ${ELZARA_ENV_FILE:?ELZARA_ENV_FILE wajib diisi - path berkas env environment ini di host target}

x-logging: &x-logging
  # Log file-driven supaya disk penuh tidak menjadi penyebab insiden berikutnya.
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "14"

services:
  api:
    <<: [*x-env-file, *x-logging]
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

  worker:
    <<: [*x-env-file, *x-logging]
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    # ulimits + deploy.resources.limits diwarisi dari basis; nilainya naik lewat WORKER_MEMORY_LIMIT
    # di berkas env environment ini, bukan lewat salinan angka di profil.

  scheduler:
    <<: [*x-env-file, *x-logging]
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

  web:
    <<: [*x-env-file, *x-logging]
    restart: unless-stopped

  admin:
    <<: [*x-env-file, *x-logging]
    restart: unless-stopped

  nginx:
    <<: *x-logging
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      # Material TLS environment ini dipasang dari luar repo; lokasinya variabel, isinya tidak (Q-1).
      - ${TLS_CERT_DIR:?TLS_CERT_DIR wajib diisi - direktori sertifikat edge di host, tidak pernah di repo}:/etc/nginx/certs:ro

networks:
  monitoring:
    internal: true
