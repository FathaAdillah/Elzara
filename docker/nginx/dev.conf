server {
    listen 80;
    server_name 127.0.0.1;
    add_header Cache-Control "no-store" always;
    return 307 $storefront_origin$request_uri;
}

server {
    listen 80 default_server;
    listen 8080;
    server_name _;
    set $edge_scheme http;
    set $edge_https "";
    include /etc/nginx/elzara/routes.inc;
}
