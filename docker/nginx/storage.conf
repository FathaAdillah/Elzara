server {
    listen 80;
    listen 8080;
    server_name ~^storage\.;

    location / {
        access_log off;
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        client_max_body_size 20m;
        add_header X-Content-Type-Options nosniff always;
    }
}
