# Traefik terminates HTTPS and forwards to this private listener.
include /etc/nginx/elzara/storage.conf;

server {
    listen 8080 default_server;
    server_name _;
    set $edge_scheme https;
    set $edge_https on;
    # Only Traefik and sibling containers reach this listener: take the client IP from the
    # X-Forwarded-For hop Traefik appends so per-IP limits and X-Real-IP see the shopper.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    include /etc/nginx/elzara/routes.inc;
}
