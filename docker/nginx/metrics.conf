# Listener scrape Prometheus: hanya di jaringan backend (tidak di-publish ke host, tidak di-route Traefik).
# Laravel juga menolak IP di luar API_INTERNAL_CIDRS (InternalAccess), jadi port ini bocor pun tetap 404.
server {
    listen 9145;
    server_name _;
    access_log off;

    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    location = /metrics {
        fastcgi_pass api_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_read_timeout 10s;
    }

    location / { return 404; }
}
