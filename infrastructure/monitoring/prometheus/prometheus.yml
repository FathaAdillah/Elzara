# Dimuat oleh service `prometheus` (profil compose `monitoring`). Target hanya di jaringan backend.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: elzara-api
    metrics_path: /metrics
    static_configs:
      - targets: ["nginx:9145"]
