# Pipeline bersama untuk kontrak + infra (ADR-010 K-2): apa yang harus hijau kalau packages/ atau docker/ berubah.
# Enam pemeriksa Doc 11 §8.8 direkonstruksi dalam repo dan diuji di setiap PR.

name: contracts

on:
  pull_request:
    paths:
      - packages/**
      - docker/**
      - scripts/**
      - docs/**
      - apps/api/app/Platform/Outbox/QueueRouting.php
      - apps/api/config/filesystems.php
      - apps/api/app/Modules/*/Infrastructure/Database/Migrations/**
      - apps/api/app/Platform/Infrastructure/Database/Migrations/**
      - apps/api/database/migrations/**
      - apps/web/package.json
      - apps/web/package-lock.json
      - apps/admin/package.json
      - apps/admin/package-lock.json
      - .agents/skills/doc-verification-gates/**
      - .codex/plans/tasklist.md
      - .github/workflows/contracts.yml
  push:
    branches: [master]
    paths:
      - packages/**
      - docker/**
      - scripts/**
      - docs/**
      - apps/api/app/Platform/Outbox/QueueRouting.php
      - apps/api/config/filesystems.php
      - apps/api/app/Modules/*/Infrastructure/Database/Migrations/**
      - apps/api/app/Platform/Infrastructure/Database/Migrations/**
      - apps/api/database/migrations/**
      - apps/web/package.json
      - apps/web/package-lock.json
      - apps/admin/package.json
      - apps/admin/package-lock.json
      - .agents/skills/doc-verification-gates/**
      - .codex/plans/tasklist.md
      - .github/workflows/contracts.yml
  workflow_dispatch:

permissions: { contents: read }

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nginx:
    name: Edge nginx rate limits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test-nginx-ratelimits.py

  openapi:
    name: Kontrak OpenAPI 3.1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parser YAML untuk gerbang inventaris auth
        run: python3 -m pip install PyYAML==6.0.3
      - name: Spektral lint (aturan elzara-* ikut jalan)
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}/packages/api-contracts:/w" -w /w \
            -v elzara-codegen-cache:/root/.npm node:22-alpine \
            sh -ec 'npm install --no-package-lock --no-audit --no-fund --ignore-scripts && npx --no-install spectral lint -r .spectral.yaml openapi.yaml'
      - name: Pastikan semua jalur Blueprint §7 tersedia
        run: |
          status=0
          while IFS= read -r path; do
            if ! grep -Fxq "  ${path}:" packages/api-contracts/openapi.yaml; then
              printf 'Jalur Blueprint hilang: %s\n' "$path"
              status=1
            fi
          done <<'BLUEPRINT_PATHS'
          /health
          /products
          /products/{slug}
          /preorder-batches
          /preorder-batches/{id}
          /cart/items
          /checkout/sessions
          /orders
          /me/orders/{id}
          /payment-intents
          /webhooks/payments/{provider}
          /product-requests
          /product-requests/{id}/attachments/presign
          /me/quotations/{id}
          /quotations/{id}/accept
          /admin/preorder-batches/{id}/close
          /admin/purchase-orders
          /admin/shipments
          BLUEPRINT_PATHS
          exit "$status"
      - name: Pastikan seluruh jalur autentikasi tersedia
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          spec = yaml.safe_load(Path(os.environ.get('OPENAPI_FILE', 'packages/api-contracts/openapi.yaml')).read_text())
          paths = spec.get('paths', {})
          if not isinstance(paths, dict):
              raise SystemExit('paths harus berupa mapping YAML')
          required = {
              '/auth/register',
              '/auth/login',
              '/auth/logout',
              '/auth/otp/request',
              '/auth/otp/verify',
              '/auth/social/{provider}/redirect',
              '/auth/social/{provider}/callback',
              '/auth/password/reset-request',
              '/auth/password/reset-confirm',
              '/admin/auth/login',
              '/admin/auth/2fa/verify',
              '/admin/auth/session',
              '/admin/auth/logout',
              '/sanctum/csrf-cookie',
          }
          missing = required - paths.keys()
          if missing:
              raise SystemExit('Jalur auth hilang: ' + ', '.join(sorted(missing)))
          print(f'Inventaris auth lengkap: {len(required)} jalur wajib tersedia')
          PY
      - name: Pastikan skema keamanan sesuai ADR-007
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          spec = yaml.safe_load(Path(os.environ.get('OPENAPI_FILE', 'packages/api-contracts/openapi.yaml')).read_text())
          schemes = spec.get('components', {}).get('securitySchemes', {})
          if not isinstance(schemes, dict):
              raise SystemExit('components.securitySchemes harus berupa mapping YAML')
          expected = {'webSession', 'adminSession', 's2sSignature'}
          missing = expected - schemes.keys()
          unexpected = schemes.keys() - expected
          if missing or unexpected:
              raise SystemExit(f'Skema keamanan tidak sesuai: hilang={sorted(missing)}, tambahan={sorted(unexpected)}')
          if any(not isinstance(scheme, dict) or not scheme for scheme in schemes.values()):
              raise SystemExit('Setiap skema keamanan wajib memiliki definisi mapping YAML')
          print('Skema keamanan sesuai: ' + ', '.join(sorted(expected)))
          PY
      - name: Uang selalu integer minor-unit, mata uang const IDR (Doc 01 §6.1)
        run: |
          grep -A2 'amount_minor:' packages/api-contracts/openapi.yaml | grep -q 'type: integer'
          grep -A3 'currency:' packages/api-contracts/openapi.yaml | grep -q 'const: IDR'

  drift:
    name: Klien hasil generate vs spesifikasi (K-3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-contract-drift.sh

  packages:
    name: packages/ui + shared-types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: shared-types typecheck
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}/packages/shared-types:/w" -w /w \
            -v elzara-codegen-cache:/root/.npm node:22-alpine \
            sh -ec 'npm install --no-package-lock --no-audit --no-fund --ignore-scripts && npx tsc --noEmit'
      - name: ui typecheck
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}/packages/ui:/w" -w /w \
            -v elzara-codegen-cache:/root/.npm node:22-alpine \
            sh -ec 'npm install --no-package-lock --no-audit --no-fund --ignore-scripts && npm run typecheck'
      - name: Tidak ada hex di luar lapis-1 token (Doc 04 §2)
        run: |
          hits=$(grep -rn --include='*.css' --include='*.tsx' --include='*.ts' -E '#[0-9a-fA-F]{3,8}' packages/ui/src | grep -v 'src/tokens/primitives.css' | grep -v 'src/tokens/presets/' || true)
          if [ -n "${hits}" ]; then echo "nilai warna konkret di luar lapis 1/preset:"; echo "${hits}"; exit 1; fi

  compose:
    name: Render compose + batas infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_KEY: base64:0000000000000000000000000000000000000000000
      ELZARA_EDGE_URL: https://shop.example.com
      APP_ENV: local
      APP_DEBUG: "false"
      POSTGRES_DB: elzara
      POSTGRES_USER: elzara
      POSTGRES_PASSWORD: elzara
      MINIO_ROOT_USER: ci-only
      MINIO_ROOT_PASSWORD: ci-only
      MINIO_PUBLIC_ENDPOINT: https://shop.example.com/storage
      AWS_DEFAULT_REGION: elzara-1
      ELZARA_S3_ACCESS_KEY: ci-only
      ELZARA_S3_SECRET_KEY: ci-only
      ELZARA_STOREFRONT_PROXY_KEY: ci-only-storefront-proxy-key-0000000000
      SMTP_HOST: smtp.example.com
      SMTP_PORT: "587"
      HORIZON_PREFIX: elzara-ci
      WORKER_MEMORY_LIMIT: 1G
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NEXT_PUBLIC_BRAND_THEME: brand
      TLS_CERT_DIR: ./nginx/certs
      GIT_SHA: ci
    steps:
      - uses: actions/checkout@v4
      - name: Berkas env kosong untuk render (config membaca env_file, bukan isi rahasianya)
        run: |
          touch "${RUNNER_TEMP}/ci.env"
          printf 'ELZARA_ENV_FILE=%s\n' "${RUNNER_TEMP}/ci.env" >> "${GITHUB_ENV}"
      - name: Basis Dokploy dan profil lokal, staging, production dapat dirender
        run: |
          docker compose -f docker/compose.yaml config --quiet
          SMTP_HOST=mailpit SMTP_PORT=1025 docker compose -f docker/compose.local.yaml config --quiet
          SMTP_HOST=mailpit SMTP_PORT=1025 docker compose -f docker/compose.local.yaml --profile search config --quiet
          docker compose -f docker/compose.yaml -f docker/profiles/staging.yaml config --quiet
          docker compose -f docker/compose.yaml -f docker/profiles/production.yaml config --quiet
      - name: Development memakai HTTP dan Mailpit pada loopback
        env:
          ELZARA_EDGE_URL: http://localhost
          ELZARA_ADMIN_ORIGIN: http://admin.localhost
          MINIO_PUBLIC_ENDPOINT: http://localhost/storage
        run: |
          SMTP_HOST=mailpit SMTP_PORT=1025 docker compose -f docker/compose.local.yaml config --format json | jq -e '
            .services.mailpit.ports[0].host_ip == "127.0.0.1" and
            .services.api.environment.MAIL_HOST == "mailpit" and
            .services.api.environment.SESSION_SECURE_COOKIE == "false" and
            (.services.nginx.ports | map(.target) == [80]) and
            (.services.nginx.volumes | map(.target) | index("/etc/nginx/certs") == null)
          '
      - name: Dokploy memakai SMTP produksi dan TLS di Traefik
        run: |
          docker compose -f docker/compose.yaml config --format json | jq -e '
            (.services | has("mailpit") | not) and
            .services.api.environment.MAIL_HOST == "smtp.example.com" and
            (.services.nginx.ports // [] | length == 0)
          '
      - name: Tidak ada service data store yang didefinisikan ulang oleh profil (satu berkas satu definisi)
        run: |
          count=$(docker compose -f docker/compose.yaml -f docker/profiles/production.yaml config | grep -c 'image: elzara/postgres')
          if [ "${count}" != "1" ]; then echo "postgres didefinisikan ${count} kali"; exit 1; fi
      - name: Tujuh dan hanya tujuh antrian Horizon (Doc 11 §8.1)
        run: |
          names=$(grep -oE 'HORIZON_QUEUES: [a-z,]+' docker/compose.yaml | cut -d' ' -f2 | tr ',' '\n' | sort -u | grep -c .)
          if [ "${names}" != "7" ]; then echo "jumlah antrian = ${names}, harus tepat 7"; exit 1; fi
          for forbidden in default search reconcile; do
            if grep -E "HORIZON_QUEUES: [a-z,]*${forbidden}" docker/compose.yaml docker/profiles/*.yaml; then
              echo "antrian terlarang ikut terdaftar: ${forbidden}"; exit 1
            fi
          done
          if grep -rn 'horizon:clear' docker scripts; then
            echo "horizon:clear per antrian terlarang (runbook queue-stuck §3.3)"; exit 1
          fi
      - name: postgres/redis/minio tidak mempublikasikan port ke host (Doc 01 §11.1)
        run: |
          rendered=$(docker compose -f docker/compose.yaml -f docker/profiles/production.yaml config --format json)
          for svc in postgres redis minio; do
            ports=$(echo "${rendered}" | jq -r ".services.${svc}.ports // empty")
            if [ -n "${ports}" ]; then echo "service ${svc} mempublikasikan port ke host: ${ports}"; exit 1; fi
          done
      - name: Elasticsearch Basic berjalan di jaringan internal tanpa port host
        run: |
          docker compose -f docker/compose.yaml --profile search config --format json | jq -e '
            .networks.search.internal == true and
            (.services.elasticsearch.networks | keys == ["search"]) and
            (.services.elasticsearch.ports // [] | length == 0) and
            .services.elasticsearch.environment["xpack.license.self_generated.type"] == "basic"
          '
      - name: object-backup membaca MinIO lewat backend dan keluar hanya lewat backup-egress
        run: |
          docker compose -f docker/compose.yaml -f docker/profiles/production.yaml --profile backup config --format json | jq -e '
            (.services["object-backup"].networks | keys | sort == ["backend", "backup-egress"]) and
            (.services["object-backup"].ports // [] | length == 0)
          '
          jq -e '[.Statement[] | select(.Effect == "Allow") | .Action[]] | all(. == "s3:ListBucket" or . == "s3:GetBucketLocation" or . == "s3:GetObject")' docker/minio/policies/elzara-backup-reader.json
          if jq -e '.. | strings | select(test("exports"))' docker/minio/policies/elzara-backup-reader.json >/dev/null; then
            echo "exports tidak termasuk object backup"; exit 1
          fi
      - name: Tepat enam bucket, tanpa bucket backup di node (Doc 01 §9.2, Doc 11 §8.7)
        run: |
          grep -q 'product-media request-attachments invoice-documents shipment-documents exports audit-archives' docker/minio/init-buckets.sh
          if grep -qE '\blocal/backups\b|\bbucket.*backups\b' docker/minio/init-buckets.sh; then
            echo "bucket backup di MinIO node ini terlarang"; exit 1
          fi
      - name: Setiap ${VAR:?} punya barisnya di docker/.env.example (Doc 01 §11.3)
        run: |
          vars=$(grep -hoE '\$\{[A-Z0-9_]+' docker/compose.yaml docker/profiles/*.yaml | tr -d '${' | sort -u)
          missing=""
          for v in ${vars}; do
            grep -qE "^${v}=|^${v} " docker/.env.example || missing="${missing} ${v}"
          done
          if [ -n "${missing}" ]; then echo "variabel tidak terdaftar di docker/.env.example:${missing}"; exit 1; fi

  docs:
    name: Konsistensi dokumen (enam pemeriksa dalam repo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Jalankan pemeriksa dan mutation tests
        run: bash scripts/verify-docs.sh
