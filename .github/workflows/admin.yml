# Pipeline artefak admin - artefak ter-deploy-mandiri kedua (ADR-010 K-1/K-2).
# packages/ui dan packages/shared-types ikut memicu kedua frontend: token yang sama harus dibuktikan jalan di
# keduanya (Doc 04 §12). Perubahan di apps/web tidak pernah memicu pipeline ini, dan sebaliknya.

name: admin

on:
  pull_request:
    paths:
      - apps/admin/**
      - packages/api-contracts/**
      - packages/shared-types/**
      - packages/ui/**
      - .github/workflows/admin.yml
  push:
    branches: [master]
    paths:
      - apps/admin/**
      - packages/api-contracts/**
      - packages/shared-types/**
      - packages/ui/**
      - .github/workflows/admin.yml
  workflow_dispatch:
    inputs:
      environment:
        description: Target deploy (staging|production)
        required: true
        default: staging

permissions: { contents: read }

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: false

env:
  APP: apps/admin
  IMAGE: elzara/admin

jobs:
  verify:
    name: 1. lint + typecheck + unit (di dalam node:22, tidak di runner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Lockfile app ini harus ada - dua app, dua lockfile (Doc 01 §11.2)
        run: |
          if [ ! -f "${APP}/package-lock.json" ]; then
            echo "package-lock.json belum di-commit; bangkitkan di dalam container, bukan di host:"
            echo "  docker run --rm -v \"\$PWD:/w\" -w /w/${APP} node:22 npm install"
            exit 1
          fi
      - name: npm ci + typecheck
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/w" -w "/w/${APP}" node:22 sh -ec 'npm ci && npm run typecheck'
      - name: Unit test hanya bila app punya runner; tanpa itu tidak ada langkah palsu
        run: |
          if grep -q '"test"' "${APP}/package.json"; then
            docker run --rm -v "${GITHUB_WORKSPACE}:/w" -w "/w/${APP}" node:22 sh -ec 'npm ci && npm test'
          else
            echo "suite unit belum ada untuk app ini - dilewati dengan pesan, bukan pura-pura hijau"
          fi

  security:
    name: 2. security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: npm audit (production deps)
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/w" -w "/w/${APP}" node:22 sh -ec 'npm ci && npm audit --omit=dev'
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: 3. build image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: security
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build Nuxt terjadi di dalam image; tag = GIT_SHA, rollback = tag sebelumnya,
      # dan tidak ada push: registry privat masih menunggu Q-1 (biaya) / Q-6 (domain, edge).
      - name: Build lokal tanpa push
        run: docker build -f apps/admin/Dockerfile -t "${IMAGE}:${GITHUB_SHA}" .
      - name: Bundle admin tidak boleh ikut ter-cache di CDN publik (Doc 04 §12) - assert image mandiri
        run: docker image inspect "${IMAGE}:${GITHUB_SHA}" --format '{{.Config.Cmd}}' | grep -Fq '.output/server/index.mjs'

  deploy:
    name: 4. deploy (TERHALA - keputusan klien)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch'
    needs: image
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
    steps:
      # Di server target, admin naik sendiri: docker compose -f docker/compose.yaml
      # -f docker/profiles/<env>.yaml up -d --no-deps admin - tanpa api, tanpa worker, tanpa web.
      # Gagal berisik kalau keputusan klien belum ada (ADR-010 K-2): deploy yang diam-diam tidak
      # terjadi lebih berbahaya daripada yang merah. Blokiran: Q-1 (pilihan jadwal; kalau J-b,
      # admin berhenti jadi artefak mandiri dan pipeline INI DIHAPUS, bukan dibiarkan menggantung),
      # Q-6 (domain/edge), Q-7 (akun staging untuk alur admin nyata).
      - name: Gerbang keputusan klien
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$REGISTRY" ]; then
            echo "target deploy/registry belum diputuskan (Q-1/Q-6) - tidak ada kredensial di repo dan tidak ada nilai contoh."
            exit 1
          fi

  smoke:
    name: 5. smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch'
    needs: deploy
    env:
      SMOKE_URL: ${{ secrets.SMOKE_BASE_URL }}
    steps:
      - name: Health probe pada origin admin
        run: |
          if [ -z "$SMOKE_URL" ]; then
            echo "SMOKE_BASE_URL belum ada (Q-6 domain/edge) - smoke target nyata tidak dijalankan."
            exit 1
          fi
          curl -fsS "${SMOKE_URL%/}/health"
