name: storefront-e2e

on:
  pull_request:
  push:
    branches: [master]

permissions: { contents: read }

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build, seed, serve and exercise journeys entirely in Docker
        run: scripts/e2e-local.sh
      - name: Keep HTML report, videos, screenshots, failure traces and stack logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-e2e-${{ github.run_attempt }}
          retention-days: 14
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/logs/
