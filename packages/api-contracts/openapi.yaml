  /products/{slug}:
    get:
      operationId: getProduct
      tags: [Catalog]
      x-elzara-auth: public
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9-]{1,120}$" } }
      responses:
        "200":
          description: Detail produk
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ProductSummary" }
                  - type: object
                    required: [description_html, variants, media]
                    properties:
                      description_html: { type: string }
                      variants: { type: array, items: { $ref: "#/components/schemas/ProductVariant" } }
                      media: { type: array, items: { $ref: "#/components/schemas/MediaRef" } }
                      options:
                        type: array
                        items:
                          type: object
                          required: [name, values]
                          properties:
                            name: { type: string }
                            values: { type: array, items: { type: string } }
                      meta_title: { type: [string, "null"] }
                      meta_description: { type: [string, "null"] }
                      care_notes: { type: [string, "null"] }
                      return_policy_notes: { type: [string, "null"] }
                      origin_country: { type: string, pattern: "^[A-Z]{2}$" }
                      collections:
                        type: array
                        items:
                          type: object
                          required: [slug, name_key]
                          properties:
                            slug: { type: string }
                            name_key: { type: string }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

