        - { name: id, in: path, required: true, schema: { type: string, pattern: "^ord_[0-9A-Za-z]{20,32}$" } }
      responses:
        "200":
          description: "Order milik pengirim saja"
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/OrderRead" }
                  - type: object
                    required: [items, status_history]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/OrderItemRead" } }
                      status_history: { type: array, items: { $ref: "#/components/schemas/StatusChange" } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /payment-intents:
    post:
      operationId: createPaymentIntent
      tags: [Payments]
      x-elzara-auth: customer
      security: [{ webSession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/XsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, channel, kind]
              properties:
                order_id: { type: string, pattern: "^ord_[0-9A-Za-z]{20,32}$" }
                channel: { type: string, enum: [virtual_account, qris, card, ewallet] }
                kind: { type: string, enum: [deposit, full, balance] }
      responses:
        "201":
          description: "Intent + instruksi bayar gateway; bentuk instruksi divalidasi ulang saat gateway pertama dipilih (Doc 03 0.15)"
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema:
                type: object
                required: [id, order_id, status, amount, instructions]
                properties:
                  id: { type: string, pattern: "^pay_[0-9A-Za-z]{20,32}$" }
                  order_id: { type: string }
                  status: { type: string, enum: [pending, awaiting_confirmation, paid, failed, expired] }
                  amount: { $ref: "#/components/schemas/Money" }
                  instructions: { type: object, additionalProperties: { type: string } }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /webhooks/payments/{provider}:
    post:
      operationId: ingestPaymentWebhook
      tags: [Payments]
      x-elzara-auth: s2s
      security: [{ s2sSignature: [] }]
      description: "Callback terverifikasi. Dedup memakai (provider, provider_event_id) lewat inbox_events; webhook_receipts milik modul Payments Sprint 2 (Doc 03 0.7)."
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, minLength: 2, maxLength: 40 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_event_id, type]
              properties:
                provider_event_id: { type: string, maxLength: 128 }
                type: { type: string, maxLength: 80 }
                occurred_at: { type: string, format: date-time }
                data: { type: object, additionalProperties: true }
      responses:
        "200":
          description: "Selalu 200 untuk retry provider yang sama supaya gateway berhenti mengirim ulang"
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema:
                type: object
                required: [received, duplicate]
                properties: { received: { type: boolean }, duplicate: { type: boolean } }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

