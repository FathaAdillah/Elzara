            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
            X-RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            X-Displayed-Timezone: { $ref: "#/components/headers/DisplayedTimezone" }
          content:
