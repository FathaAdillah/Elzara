                  tracking_number: { type: ["string", "null"] }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  # --- Auth & sesi: PENAMBAHAN setelah mekanisme diputuskan pemilik 2026-11-18 (Doc 11 §4.4 C/I,
  # ADR-007 (BFF/sesi) amandemen D-1a..D-6a, ADR-012 (RBAC/identitas/dependensi) D-4).
  # Storefront hybrid: email+password, Google, X (login DAN registrasi). Admin: email+password saja
  # + 2FA wajib + is_operator. Semua mutasi sesi menuntut X-XSRF-TOKEN; panggil /sanctum/csrf-cookie
  # sebelum mutasi pertama. Tidak ada Idempotency-Key di grup ini: pengulangan dijaga unique email,
  # token sekali-pakai, dan rate limit - bukan replay key (Doc 12 §2.2 kelompok S).

  /auth/register:
    post:
      operationId: registerAccount
      tags: [Identity]
      x-elzara-auth: public
      security: []
      description: "Registrasi storefront email+password; jalur sosial lewat /auth/social/{provider}/redirect. Akun sosial hanya digabung ke akun yang ada lewat email TERVERIFIKASI, bukan email mentah provider (Doc 11 §4.4 C). Rate limit wajib di edge dan API."
      parameters: [{ $ref: "#/components/parameters/XsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 72, description: "Maksimal 72 byte UTF-8 (batas bcrypt); lebih panjang ditolak 422." }
                locale: { type: string, enum: [id, en], default: id }
      responses:
        "201":
          description: "Akun dibuat + sesi web dibuka; email verifikasi dikirim (UserRegistered)"
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Set-Cookie: { $ref: "#/components/headers/WebSessionCookie" }
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/AuthUserRead" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/login:
    post:
      operationId: loginWeb
      tags: [Identity]
      x-elzara-auth: public
      security: []
      description: "Login storefront email+password untuk akun active apa pun; operator yang berbelanja di sini adalah aktor web (X-Actor-Type diisi server dari guard). Cookie admin tidak pernah diterima guard web. Kredensial salah -> 401, bukan redirect HTML."
      parameters: [{ $ref: "#/components/parameters/XsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: "Sesi web dibuka (Set-Cookie elzara_web_session)"
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Set-Cookie: { $ref: "#/components/headers/WebSessionCookie" }
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/AuthUserRead" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/logout:
    post:
      operationId: logoutWeb
      tags: [Identity]
      x-elzara-auth: customer
      security: [{ webSession: [] }]
      description: "Tutup sesi web: cookie dihapus dan baris user_sessions diberi revoked_at."
      parameters: [{ $ref: "#/components/parameters/XsrfToken" }]
      responses:
        "204":
          description: "Sesi ditutup; tanpa body"
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /auth/otp/request:
    post:
      operationId: requestOtp
      tags: [Identity]
      x-elzara-auth: public
      security: []
      description: "Minta OTP (otp_challenges, modul Identity) untuk purpose login | reset_password | verify_phone | verify_email. Saat ini hanya login dan verify_email lewat channel email yang dilayani; kombinasi lain -> 422 (reset kata sandi memakai /auth/password/reset-request, OTP telepon menunggu gateway). Respons identik ada/tidaknya akun (anti-enumeration); kode hanya dikirim bila akun ada. Rate limit ketat di edge dan API."
      parameters: [{ $ref: "#/components/parameters/XsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, channel, purpose]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                channel: { type: string, enum: [email, whatsapp, sms] }
                purpose: { type: string, enum: [login, reset_password, verify_phone, verify_email] }
      responses:
        "200":
          description: "Challenge dibuat (atau diam-diam tidak, bila akun tidak ada) + masa berlaku"
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema:
                type: object
                required: [sent, expires_at]
                properties:
                  sent: { type: boolean }
                  expires_at: { type: string, format: date-time }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [Identity]
      x-elzara-auth: public
      security: []
      description: "Verifikasi kode OTP; percobaan dibatasi (otp_challenges.attempts) dan challenge sekali-pakai (consumed_at). purpose=login membuka sesi web; purpose=verify_email mengisi users.email_verified_at (syarat penautan akun sosial); purpose lain menandai challenge terverifikasi untuk langkah berikutnya. Kode salah/kedaluwarsa -> 401."
      parameters: [{ $ref: "#/components/parameters/XsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, purpose, code]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                purpose: { type: string, enum: [login, reset_password, verify_phone, verify_email] }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: "Terverifikasi; Set-Cookie hanya bila purpose=login"
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Set-Cookie: { $ref: "#/components/headers/WebSessionCookie" }
          content:
            application/json:
              schema:
                type: object
                required: [verified, purpose]
                properties:
                  verified: { type: boolean, const: true }
                  purpose: { type: string, enum: [login, reset_password, verify_phone, verify_email] }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/social/{provider}/redirect:
    get:
      operationId: redirectSocialLogin
      tags: [Identity]
      x-elzara-auth: public
      security: []
      description: "Redirect OAuth untuk login DAN registrasi: google atau x (keduanya driver OAuth 2.0 bawaan laravel/socialite; X memakai PKCE). State OAuth diterbitkan di sini dan wajib divalidasi di callback. Tanpa intent=link, callback selalu membuka sesi untuk akun milik identitas sosial itu (sesi lain di browser ditutup), tidak pernah menautkan ke akun yang sedang terbuka."
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, x] } }
        - { name: intent, in: query, required: false, description: "link = tautkan identitas ke akun yang sedang masuk", schema: { type: string, enum: [link] } }
      responses:
        "302":
          description: "Redirect ke halaman otorisasi provider"
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Location: { description: "URL otorisasi provider, membawa state", schema: { type: string, format: uri } }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/social/{provider}/callback:
    get:
      operationId: handleSocialCallback
      tags: [Identity]
      x-elzara-auth: public
      security: []
      description: "Callback OAuth. Identitas sosial disimpan di user_identities (provider, provider_user_id) unik per provider. Penggabungan akun HANYA lewat email terverifikasi, bukan email mentah dari provider (Doc 11 §4.4 C). Penautan tidak aman atau identitas yang sudah tertaut ke akun lain -> 409 Problem Details. Sukses: sesi web dibuka + redirect ke app; state/code tidak valid -> 401 problem, bukan redirect diam-diam."
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, x] } }
        - { name: code, in: query, required: true, schema: { type: string, maxLength: 512 } }
        - { name: state, in: query, required: true, schema: { type: string, maxLength: 512 } }
      responses:
        "302":
          description: "Login/registrasi sosial sukses; redirect ke app dengan sesi web"
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Location: { description: "URL app tujuan (same-origin)", schema: { type: string, format: uri } }
            Set-Cookie: { $ref: "#/components/headers/WebSessionCookie" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /me/sessions:
    get:
      operationId: listMySessions
      tags: [Identity]
      x-elzara-auth: customer
      security: [{ webSession: [] }]
      description: "Daftar sesi/perangkat aktif milik akun sendiri (user_sessions.revoked_at IS NULL), cursor."
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" }]
      responses:
        "200":
          description: "Halaman daftar sesi"
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SessionRead" } }
                  meta: { $ref: "#/components/schemas/CursorMeta" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /me/sessions/{session_id}:
    delete:
      operationId: revokeMySession
      tags: [Identity]
      x-elzara-auth: customer
      security: [{ webSession: [] }]
      description: "Cabut satu sesi perangkat (user_sessions.revoked_at). Hanya milik akun sendiri (policy owner); bukan milik sendiri -> 404. Mencabut sesi yang sedang dipakai = logout perangkat ini."
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - { $ref: "#/components/parameters/XsrfToken" }
      responses:
        "204":
          description: "Sesi dicabut; tanpa body"
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /auth/password/reset-request:
    post:
      operationId: requestPasswordReset
      tags: [Identity]
      x-elzara-auth: public
      security: []
      description: "Kirim token reset sekali-pakai ke email akun. Respons selalu sama ada/tidaknya akun (anti-enumeration). Rate limit ketat di edge dan API."
      parameters: [{ $ref: "#/components/parameters/XsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "200":
          description: "Permintaan diterima (pengiriman nyata hanya bila akun ada)"
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent: { type: boolean }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/password/reset-confirm:
    post:
      operationId: confirmPasswordReset
      tags: [Identity]
      x-elzara-auth: public
      security: []
      description: "Token reset sekali-pakai + password baru; semua sesi web lain dicabut setelah sukses. Token salah/kedaluwarsa/terpakai -> 401."
      parameters: [{ $ref: "#/components/parameters/XsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, minLength: 16, maxLength: 128 }
                password: { type: string, minLength: 8, maxLength: 72, description: "Maksimal 72 byte UTF-8 (batas bcrypt); lebih panjang ditolak 422." }
      responses:
        "200":
          description: "Password diganti; sesi lain dicabut"
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema:
                type: object
                required: [reset]
                properties:
                  reset: { type: boolean, const: true }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/auth/login:
    post:
      operationId: loginAdmin
      tags: [Identity]
      x-elzara-auth: public
      security: []
      description: "Login operator aktif. Ambil CSRF melalui GET /sanctum/csrf-cookie?scope=admin&purpose=login. Login biasanya menerbitkan challenge 2FA. Pada environment local, satu email operator yang dikonfigurasi dapat menerima sesi setelah kata sandi terverifikasi."
      parameters: [{ $ref: "#/components/parameters/XsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: "Tantangan 2FA atau sesi yang sudah dibuka untuk operator development lokal"
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
            X-RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            X-Displayed-Timezone: { $ref: "#/components/headers/DisplayedTimezone" }
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Set-Cookie: { $ref: "#/components/headers/AdminSessionCookie" }
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [two_factor_required, challenge_id, expires_at]
                    properties:
                      two_factor_required: { type: boolean, const: true }
                      challenge_id: { type: string, maxLength: 128, description: "Token tantangan opaque ber-TTL pendek, ditandatangani server." }
                      expires_at: { type: string, format: date-time }
                  - type: object
                    required: [two_factor_required, authenticated, user]
                    properties:
                      two_factor_required: { type: boolean, const: false }
                      authenticated: { type: boolean, const: true }
                      user: { $ref: "#/components/schemas/AuthUserRead" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "419": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/auth/2fa/verify:
    post:
      operationId: verifyAdminTwoFactor
      tags: [Identity]
      x-elzara-auth: public
      security: []
      description: "Konfirmasi 2FA dari browser yang memulai challenge. Ambil CSRF dengan scope=admin dan purpose=login. Terima TOTP atau recovery code sekali pakai. Sukses meregenerasi sesi, menghapus cookie challenge, dan membuka guard admin. Kode salah atau challenge kedaluwarsa menghasilkan 401."
      parameters: [{ $ref: "#/components/parameters/XsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, code]
              properties:
                challenge_id: { type: string, maxLength: 128 }
                code: { type: string, minLength: 6, maxLength: 12, description: "TOTP 6 digit atau recovery code." }
      responses:
        "200":
          description: "2FA terkonfirmasi; sesi admin dibuka"
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
            X-RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            X-Displayed-Timezone: { $ref: "#/components/headers/DisplayedTimezone" }
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Set-Cookie: { $ref: "#/components/headers/AdminSessionCookie" }
          content:
            application/json:
              schema:
                type: object
                required: [authenticated, user, permissions, is_admin]
                properties:
                  authenticated: { type: boolean, const: true }
                  permissions: { type: array, items: { type: string }, description: Sorted effective admin permission names. }
                  is_admin: { type: boolean }
                  user: { $ref: "#/components/schemas/AuthUserRead" }
        "401": { $ref: "#/components/responses/Problem" }
        "419": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/users/{user}/access:
    get:
      operationId: adminUserAccessGet
      tags: [Identity]
      x-elzara-auth: admin
      x-elzara-permission: user.view
      security: [{ adminSession: [] }]
      description: "Read operator roles, scopes, direct and effective permissions."
      parameters:
        - { $ref: "#/components/parameters/AccessUser" }
      responses:
        "200": { $ref: "#/components/responses/AdminAccess" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/users/{user}/permissions:
    post:
      operationId: adminUserPermissionGrant
      tags: [Identity]
      x-elzara-auth: admin
      x-elzara-permission: user.update
      security: [{ adminSession: [] }]
      description: "Grant an admin permission directly; target must be an operator. Non-bypass actors need global access to the permission. Self-change returns 403 with code RBAC_SELF_ACCESS_CHANGE and detail Operators can't change their own access. Other authorization denials use FORBIDDEN."
      parameters:
        - { $ref: "#/components/parameters/AccessUser" }
        - { $ref: "#/components/parameters/AccessIdempotencyKey" }
        - { $ref: "#/components/parameters/XsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminPermissionGrant" }
      responses:
        "200": { $ref: "#/components/responses/AdminAccess" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "419": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/users/{user}/permissions/{permission}:
    delete:
      operationId: adminUserPermissionRevoke
      tags: [Identity]
      x-elzara-auth: admin
      x-elzara-permission: user.update
      security: [{ adminSession: [] }]
      description: "Revoke a direct permission. Send the required reason in the JSON request body. Self-change returns 403 with code RBAC_SELF_ACCESS_CHANGE and detail Operators can't change their own access."
      parameters:
        - { $ref: "#/components/parameters/AccessUser" }
        - name: permission
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/AccessIdempotencyKey" }
        - { $ref: "#/components/parameters/XsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAccessReason" }
      responses:
        "200": { $ref: "#/components/responses/AdminAccess" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "419": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/users/{user}/roles:
    post:
      operationId: adminUserRoleAssign
      tags: [Identity]
      x-elzara-auth: admin
      x-elzara-permission: user.update
      security: [{ adminSession: [] }]
      description: "Assign an admin role and optionally add a batch, category or warehouse scope. Omitted scope means global. Non-bypass actors must hold every permission globally for a global assignment, or globally/within the requested scope for a scoped assignment. Self-change returns 403 with code RBAC_SELF_ACCESS_CHANGE and detail Operators can't change their own access."
      parameters:
        - { $ref: "#/components/parameters/AccessUser" }
        - { $ref: "#/components/parameters/AccessIdempotencyKey" }
        - { $ref: "#/components/parameters/XsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRoleAssignment" }
      responses:
        "200": { $ref: "#/components/responses/AdminAccess" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "419": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/users/{user}/roles/{role}:
    delete:
      operationId: adminUserRoleRevoke
      tags: [Identity]
      x-elzara-auth: admin
      x-elzara-permission: user.update
      security: [{ adminSession: [] }]
      description: "Revoke a role and all its scopes. Send the required reason in the JSON request body. Self-change returns 403 with code RBAC_SELF_ACCESS_CHANGE and detail Operators can't change their own access."
      parameters:
        - { $ref: "#/components/parameters/AccessUser" }
        - name: role
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/AccessIdempotencyKey" }
        - { $ref: "#/components/parameters/XsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAccessReason" }
      responses:
        "200": { $ref: "#/components/responses/AdminAccess" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "419": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/auth/session:
    get:
      operationId: getAdminSession
      tags: [Identity]
      x-elzara-auth: admin
      security: [{ adminSession: [] }]
      description: "Verifikasi dan baca sesi operator dari cookie admin yang aktif. Operasi hanya membaca sesi pemanggil, tanpa izin modul tambahan."
      responses:
        "200":
          description: "Sesi admin aktif yang memenuhi kebijakan autentikasi environment"
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
            X-RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            X-Displayed-Timezone: { $ref: "#/components/headers/DisplayedTimezone" }
          content:
            application/json:
              schema:
                type: object
                required: [authenticated, user, permissions, is_admin]
                properties:
                  authenticated: { type: boolean, const: true }
                  permissions: { type: array, items: { type: string }, description: Sorted effective admin permission names. }
                  is_admin: { type: boolean }
                  user: { $ref: "#/components/schemas/AuthUserRead" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/auth/logout:
    post:
      operationId: logoutAdmin
      tags: [Identity]
      x-elzara-auth: admin
      security: [{ adminSession: [] }]
      description: "Tutup sesi pemanggil, hapus cookie admin, dan isi user_sessions.revoked_at. Ambil CSRF melalui GET /sanctum/csrf-cookie?scope=admin. Logout berlaku bagi setiap pemilik sesi admin yang aktif."
      parameters: [{ $ref: "#/components/parameters/XsrfToken" }]
      responses:
        "204":
          description: "Sesi admin ditutup; tanpa body"
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
            X-RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            X-Displayed-Timezone: { $ref: "#/components/headers/DisplayedTimezone" }
        "401": { $ref: "#/components/responses/Problem" }
        "419": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /sanctum/csrf-cookie:
    servers:
      - url: https://localhost
        description: "Endpoint bawaan Sanctum di root host yang sama, DI LUAR /api/v1 (pemisah path edge; ADR-007 D-2a)."
    get:
      operationId: getCsrfCookie
      tags: [Platform]
      x-elzara-auth: public
      security: []
      description: "Dipanggil klien sebelum mutasi pertama. Men-set cookie XSRF-TOKEN yang sengaja TIDAK HttpOnly karena dibaca JavaScript untuk header X-XSRF-TOKEN - itu desain Sanctum, bukan kelalaian. Tidak membuka sesi apa pun."
      parameters:
        - name: scope
          in: query
          description: "Nilai admin memilih permukaan admin. Jika kosong, pilih storefront."
          schema: { type: string, const: admin }
        - name: purpose
          in: query
          description: "Dengan scope=admin, nilai login memilih cookie challenge untuk login dan verifikasi 2FA."
          schema: { type: string, const: login }
      responses:
        "204":
          description: "Cookie XSRF-TOKEN di-set; tanpa body"
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Set-Cookie: { $ref: "#/components/headers/XsrfTokenCookie" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    webSession:
      type: apiKey
      in: cookie
      name: elzara_web_session
      description: "Cookie sesi guard web (laravel/sanctum statefulApi). Secure; HttpOnly; SameSite=Lax; Path=/ - same-site karena edge satu host dengan pemisah path (/api/v1/webhooks/, /api/, /storage/, /admin, /), tanpa CORS lintas origin dan tanpa SameSite=None (ADR-007 D-2a). Path=/ wajib agar cookie ikut terkirim ke /api/; pemisahan dari admin lewat NAMA cookie + guard, bukan path. Setiap mutasi menuntut header X-XSRF-TOKEN (parameter XsrfToken). Otorisasi storefront = kepemilikan (policy owner) + status akun; spatie tidak dipakai di guard web, dan is_operator/is_admin tidak memberi hak apa pun di sini."
    adminSession:
      type: apiKey
      in: cookie
      name: elzara_admin_session
      description: "Cookie sesi guard admin. Secure; HttpOnly; SameSite=Lax; Path=/. Operator harus aktif dan memenuhi kebijakan 2FA. Pengecualian kata sandi berlaku untuk satu operator yang dikonfigurasi pada environment local. Cookie web tidak diterima guard admin. 403 FORBIDDEN bila permission modul yang diperlukan tidak dimiliki. is_admin = true membypass RBAC lewat Gate::before khusus guard admin dan SETIAP pemakaian menulis audit_logs (action rbac.bypass, reason, request_id)."
    s2sSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: "Penanda skema tanda tangan/HMAC server-to-server, BUKAN bearer token dan bukan cookie sesi. Nama header konkret mengikuti driver provider (X-<Provider>-Signature, Doc 12 §5.2); nilai = HMAC atas body mentah dengan secret per driver + replay window. Nama X-Provider-Signature di sini representasi kontrak: OpenAPI tidak memodelkan nama header per-provider dalam satu skema. Worker internal memakai jaringan internal, bukan header ini. personal_access_tokens tidak dibuat (ADR-007 D-3a)."
  parameters:
    AccessUser:
      name: user
      in: path
      required: true
      description: Public user ULID, never the internal numeric identifier.
      schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
    AccessIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID v4. Identical requests replay for 24 hours; changed payload returns 409.
      schema: { type: string, format: uuid, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: "Wajib pada SETIAP mutasi (POST/PATCH/PUT/DELETE) yang memakai sesi web/admin, tanpa pengecualian untuk admin. Nilai dibaca JavaScript dari cookie XSRF-TOKEN (sengaja tidak HttpOnly) setelah GET /sanctum/csrf-cookie; token tidak cocok/kedaluwarsa -> 419 (Doc 12 §4.3)."
      schema: { type: string, minLength: 1, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: "Opaque base64url; klien dilarang mem-parse atau membangun sendiri (Doc 12 §3.3)."
      schema: { type: string, maxLength: 512 }
    RequestIdIn:
      name: X-Request-Id
      in: header
      required: false
      description: "Dipakai apa adanya bila valid; bila kosong server membuat ULID (Doc 12 §3.2)."
      schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,128}$" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "UUIDv4 atau ULID. Key sama + payload beda = 409 (Doc 12 §3.4)."
      schema:
        type: string
        pattern: "^([0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|[0-9A-HJKMNP-TV-Z]{26})$"
  headers:
    RateLimitLimit:
      description: "Batas permintaan per jendela 60 detik."
      schema: { type: integer, minimum: 1 }
    RateLimitRemaining:
      description: "Sisa permintaan pada bucket akun/IP saat ini."
      schema: { type: integer, minimum: 0 }
    RateLimitReset:
      description: "Waktu reset bucket: epoch UTC detik."
      schema: { type: integer, format: int64 }
    RateLimitPolicy:
      description: "Kebijakan origin yang berlaku; ambang sementara menunggu k6."
      schema: { type: string }
    RetryAfter:
      description: "Detik sebelum mencoba kembali; hanya pada respons 429."
      schema: { type: integer, minimum: 1 }
    DisplayedTimezone:
      description: "Zona IANA users.timezone pada permintaan terautentikasi."
      schema: { type: string, example: Asia/Jakarta }
    RequestId:
      description: "Selalu dikembalikan, termasuk 4xx/5xx dan response replay."
      schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,128}$" }
    IdempotencyReplayed:
      description: "true bila respons ini hasil replay key yang sama."
      schema: { type: boolean }
    WebSessionCookie:
      description: "elzara_web_session=<opaque>; Secure; HttpOnly; SameSite=Lax; Path=/ (guard web)."
      schema: { type: string }
    AdminSessionCookie:
      description: "elzara_admin_session=<opaque>; Secure; HttpOnly; SameSite=Lax; Path=/. Diterbitkan ketika sesi admin dibuka."
      schema: { type: string }
    XsrfTokenCookie:
      description: "XSRF-TOKEN=<nilai>; Secure; SameSite=Lax; Path=/ - sengaja TANPA HttpOnly agar dibaca JavaScript untuk header X-XSRF-TOKEN (ADR-007 D-2a)."
      schema: { type: string }
  responses:
    AdminAccess:
      description: Current access state. No-store; mutations are audited and replayable.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
        X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
        X-RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
        X-Displayed-Timezone: { $ref: "#/components/headers/DisplayedTimezone" }
        Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminUserAccess" }
    Problem:
      description: "Error RFC 7807 (application/problem+json) dengan X-Request-Id."
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
        X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
        X-RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
        X-Displayed-Timezone: { $ref: "#/components/headers/DisplayedTimezone" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    RateLimited:
      description: "Batas akun/IP terlampaui; coba lagi setelah Retry-After detik."
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
        X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
        X-RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
        X-Displayed-Timezone: { $ref: "#/components/headers/DisplayedTimezone" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
