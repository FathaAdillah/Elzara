      tags: [Settings]
      x-elzara-auth: admin
      x-elzara-permission: setting.update
      security: [{ adminSession: [] }]
      description: Atomic audited update; UUID v4 key replays the original body, different payload returns 409.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
        - { $ref: "#/components/parameters/XsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flags, reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 320, pattern: '\S' }
                flags:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [code, default_enabled]
                    dependentRequired: { env: [enabled], enabled: [env], rollout_percent: [env, enabled] }
                    properties:
                      code: { type: string, maxLength: 64 }
                      default_enabled: { type: boolean }
                      env: { type: string, enum: [local, staging, prod] }
                      enabled: { type: boolean }
                      rollout_percent: { type: integer, minimum: 0, maximum: 100, default: 100 }
      responses:
        "200":
          description: Updated flags with overrides
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
            X-RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            X-Displayed-Timezone: { $ref: "#/components/headers/DisplayedTimezone" }
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureFlagAdminList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "419": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
