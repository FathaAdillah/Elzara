      "operationId": "setDefaultAddress",
      "tags": [
        "Identity"
      ],
      "x-elzara-auth": "customer",
      "security": [
        {
          "webSession": []
        }
      ],
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        },
        {
          "$ref": "#/components/parameters/XsrfToken"
        },
        {
          "$ref": "#/components/parameters/IdempotencyKey"
        }
      ],
      "responses": {
        "200": {
          "description": "Success",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AddressRead"
              }
            }
          }
        },
        "401": {
          "$ref": "#/components/responses/Problem"
        },
        "404": {
          "$ref": "#/components/responses/Problem"
        },
        "409": {
          "$ref": "#/components/responses/Problem"
        },
        "422": {
          "$ref": "#/components/responses/Problem"
        },
        "429": {
          "$ref": "#/components/responses/RateLimited"
        }
      }
    }
  }

  /orders:
    post:
      operationId: createOrder
      tags: [Orders]
      x-elzara-auth: customer
      security: [{ webSession: [] }]
      description: "Idempoten penuh: key + payload sama = response identik dengan header Idempotency-Replayed (Doc 12 §3.4)."
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/RequestIdIn" }, { $ref: "#/components/parameters/XsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checkout_session_id, shipping_address_id]
              properties:
                checkout_session_id: { type: string, pattern: "^cs_[0-9A-Za-z]{20,32}$" }
                shipping_address_id: { type: string, pattern: "^adr_[0-9A-Za-z]{20,32}$" }
                note: { type: ["string", "null"], maxLength: 1000 }
      responses:
        "201":
          description: "Order lahir langsung awaiting_payment; draft tidak dipakai (Doc 11 §8.3)"
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
            X-RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            X-Displayed-Timezone: { $ref: "#/components/headers/DisplayedTimezone" }
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderRead" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: Checkout disabled; retryable CHECKOUT_DISABLED with localized explanation
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
            X-RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            X-Displayed-Timezone: { $ref: "#/components/headers/DisplayedTimezone" }
          content:
            application/problem+json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ProblemDetails" }
                  - type: object
                    properties:
                      type: { type: string, const: 'urn:elzara:problem:server:checkout-disabled' }
                      code: { type: string, const: CHECKOUT_DISABLED }
                      retryable: { type: boolean, const: true }

  /me/orders/{id}:
    get:
      operationId: getMyOrder
      tags: [Orders]
      x-elzara-auth: customer
      security: [{ webSession: [] }]
