              schema: { type: object, required: [data, meta], properties: { data: { type: array, items: { $ref: "#/components/schemas/CatalogCategory" } }, meta: { $ref: "#/components/schemas/CursorMeta" } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: adminCatalogCategoriesCreate
      tags: [Catalog]
      x-elzara-auth: admin
      x-elzara-permission: catalog.create
      security: [{ adminSession: [] }]
      description: "Buat kategori; diaudit"
