    OrderRead:
      type: object
      required: [id, status, total, created_at]
      properties:
        id: { type: string, pattern: "^ord_[0-9A-Za-z]{20,32}$" }
        # Nilai status dibaca dari CHECK Doc 09 lewat app/Platform/Domain/Status; tidak ada salinan kedua di spec (D-S0-4, Doc 11 §8.3).
        status: { type: string }
        total: { $ref: "#/components/schemas/Money" }
        created_at: { type: string, format: date-time }
    OrderItemRead:
      type: object
      required: [id, name, quantity, unit_price]
      properties:
        id: { type: string, pattern: "^item_[0-9A-Za-z]{20,32}$" }
        name: { type: string }
        quantity: { type: integer, minimum: 1 }
        unit_price: { $ref: "#/components/schemas/Money" }
    StatusChange:
      type: object
      required: [axis, to, changed_at]
      properties:
        axis: { type: string, enum: [fulfillment, payment, sourcing, preorder] }
        from: { type: ["string", "null"] }
        to: { type: string }
        changed_at: { type: string, format: date-time }
    PreorderBatchSummary:
      type: object
      required: [id, name, status, closes_at]
      properties:
        id: { type: string, pattern: "^batch_[0-9A-Za-z]{20,32}$" }
        name: { type: string }
        status: { type: string, enum: [open, closing, closed, cancelled] }
        closes_at: { type: string, format: date-time }
    ProductRequestRead:
      type: object
      required: [id, status, created_at]
      properties:
        id: { type: string, pattern: "^prq_[0-9A-Za-z]{20,32}$" }
        status: { type: string }
        created_at: { type: string, format: date-time }
    QuotationRead:
      type: object
      required: [id, current_version, status, total]
      properties:
        id: { type: string, pattern: "^quo_[0-9A-Za-z]{20,32}$" }
        current_version: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, sent, accepted, rejected, expired] }
        total: { $ref: "#/components/schemas/Money" }
    AuthUserRead:
      type: object
      required: [user_id, name, email]
      description: "Identitas publik akun = users.public_id (ULID, S-4); tanpa prefiks entitas bisnis karena user bukan objek transaksi."
      properties:
        user_id: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
        name: { type: string }
        email: { type: string, format: email }
        email_verified_at: { type: ["string", "null"], format: date-time }
        timezone: { type: string, description: "Zona IANA akun; default Asia/Jakarta. Tersedia pada payload admin." }
    SessionRead:
      type: object
      required: [id, last_seen_at, is_current]
      description: "Baris user_sessions (modul Identity, layar perangkat di profil). id = session_hash: hash identitas sesi, BUKAN nilai cookie sesi, sehingga aman ditampilkan dan dipakai untuk revoke."
      properties:
        id: { type: string, maxLength: 64 }
        device_label: { type: ["string", "null"], maxLength: 80 }
        user_agent: { type: ["string", "null"], maxLength: 255 }
        ip_address: { type: ["string", "null"] }
        last_seen_at: { type: string, format: date-time }
        is_current: { type: boolean, description: "true bila baris ini sesi yang sedang dipakai request ini (dihitung server)." }
