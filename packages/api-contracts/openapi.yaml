        alt: { type: ["string", "null"] }
    ProductSummary:
      type: object
      required: [id, slug, name, price, available, kind]
      properties:
        id: { type: string, pattern: "^prd_[0-9A-Za-z]{20,32}$" }
        slug: { type: string }
        name: { type: string }
        brand: { type: ["string", "null"] }
        price: { $ref: "#/components/schemas/Money" }
        available: { type: integer, minimum: 0 }
        kind: { type: string, enum: [rts, pre_order, request_order] }
        primary_media: { oneOf: [{ $ref: "#/components/schemas/MediaRef" }, { type: "null" }] }
        kinds: { type: array, items: { type: string, enum: [rts, pre_order, request_order] } }
        category:
          type: object
          required: [slug, name]
          properties:
            slug: { type: string }
            name: { type: string }
        eta:
          oneOf:
            - type: "null"
            - type: object
              required: [min_days, max_days]
              properties:
                min_days: { type: integer, minimum: 0 }
                max_days: { type: integer, minimum: 0 }
    CategoryNode:
      type: object
      required: [slug, name_key, name, parent, position]
      properties:
        slug: { type: string }
        name_key: { type: string }
        name: { type: string, description: "Shop-localized category name, falling back to name_key." }
        parent: { type: [string, "null"] }
        position: { type: integer }
    ProductVariant:
      type: object
      required: [id, sku, price, available]
      properties:
        id: { type: string, pattern: "^var_[0-9A-Za-z]{20,32}$" }
        sku: { type: string }
        label: { type: string }
        price: { $ref: "#/components/schemas/Money" }
        available: { type: integer, minimum: 0 }
        attributes: { type: object, additionalProperties: { type: string } }
