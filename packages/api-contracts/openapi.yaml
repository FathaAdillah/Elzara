  # hadir (gate I-7 memeriksa keberadaan); jalur auth sesi di bawah adalah PENAMBAHAN sejak amandemen
  # 2026-11-18 (Doc 11 §4.4 I), bukan penggantian satu pun jalur Blueprint.
  /products:
    get:
      operationId: listProducts
      tags: [Catalog]
      x-elzara-auth: public
      security: []
      description: "Active products with active variants. Unknown or invalid query parameters return 422. Stock and effective retail prices are read live; public cache lifetime is at most 30 seconds."
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: q, in: query, description: "Typo-tolerant name, brand and series search.", schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: kind, in: query, schema: { type: string, enum: [rts, pre_order, request_order] } }
        - { name: category, in: query, description: "Category slug, including descendants.", schema: { type: string, pattern: "^[a-z0-9-]{1,80}$" } }
        - { name: collection, in: query, schema: { type: string, pattern: "^[a-z0-9-]{1,80}$" } }
        - { name: brand, in: query, schema: { type: string, pattern: "^[a-z0-9-]{1,80}$" } }
        - { name: price_min, in: query, schema: { type: integer, minimum: 0 }, description: "Inclusive minimum product price in minor units." }
        - { name: price_max, in: query, schema: { type: integer, minimum: 0 }, description: "Inclusive maximum product price; must be >= price_min." }
        - { name: in_stock, in: query, schema: { type: boolean }, description: "True selects available > 0; false selects available = 0. Also accepts 1/0." }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc, relevance], default: newest }, description: "Relevance requires q. Every order has a unique id tie-breaker." }
      responses:
        "200":
          description: "Halaman katalog publik (cursor, tanpa total - Doc 12 §3.3)"
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ProductSummary" } }
                  meta: { $ref: "#/components/schemas/CursorMeta" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /categories:
    get:
      operationId: listCategories
      tags: [Catalog]
      x-elzara-auth: public
      security: []
      description: "Active category tree as flat nodes; inactive ancestors hide their descendants. Unknown parameters return 422."
      responses:
        "200":
          description: Navigation and facet categories
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
